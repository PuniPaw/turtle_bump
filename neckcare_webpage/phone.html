<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeckCare - 폰 카메라 전송</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="css/styles.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .phone-card { width: 100%; max-width: 380px; }
  .phone-card h1 { font-size: 18px; margin-bottom: 4px; }
  .phone-status { font-size: 14px; color: var(--text-2); margin-top: 2px; }
  .phone-room-form { display: flex; gap: 8px; margin-top: 14px; }
  .phone-room-form input {
    flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border-strong); font-size: 18px; letter-spacing: 3px;
    text-transform: uppercase; font-family: inherit;
  }
  .phone-btn {
    padding: 10px 16px; border-radius: 10px; border: 0;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 14.5px; cursor: pointer;
  }
  .phone-btn:disabled { background: var(--idle); cursor: default; }
  .phone-video-wrap {
    position: relative; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden;
    background: #131220; margin-top: 14px;
  }
  .phone-video-wrap video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
  }
</style>
</head>
<body>
  <section class="card phone-card" aria-label="폰 카메라 전송">
    <h1>NeckCare 폰 카메라</h1>
    <p class="phone-status" data-role="status">PC 화면에 뜬 코드를 입력하면 카메라가 연결됩니다.</p>

    <form class="phone-room-form" data-role="room-form">
      <input type="text" maxlength="4" placeholder="코드" data-role="room-input" autocomplete="off">
      <button type="submit" class="phone-btn" data-role="room-submit">연결</button>
    </form>

    <div class="phone-video-wrap">
      <video data-role="video" playsinline muted></video>
    </div>
  </section>

  <script type="module" src="js/phone.js"></script>
</body>
</html>
