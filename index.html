<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NeckCare - 자세 모니터링</title>

    <!-- C 담당이 만든 대시보드 디자인 적용 -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <!-- 전체 웹페이지 -->
    <div class="app">

        <!-- 왼쪽 메뉴 -->
        <aside id="sidebar" class="sidebar"></aside>

        <!-- 메인 화면 -->
        <main class="main">

            <!-- 상단 제목 및 분석 상태 -->
            <div id="header"></div>

            <!-- 거북목 경고 배너 -->
            <div id="alert"></div>

            <!-- 대시보드 2열 배치 -->
            <div class="dashboard">

                <!-- 왼쪽: 카메라와 분석 정보 -->
                <div class="col">

                    <!-- 카메라 영상 -->
                    <div id="camera"></div>

                    <!-- 현재 자세 판정 -->
                    <div id="posture-status"></div>

                    <!-- 거북목 발생 빈도 그래프 -->
                    <div id="frequency"></div>

                    <!-- 분석 통계 카드 -->
                    <div id="stats"></div>

                </div>

                <!-- 오른쪽: 기록과 설정 -->
                <div class="col col--side">

                    <!-- 자세 감지 기록 -->
                    <div id="history"></div>

                    <!-- 알림 강도 설정 -->
                    <div id="notify"></div>

                    <!-- 바른 자세 안내 -->
                    <div id="tips"></div>

                </div>

            </div>

        </main>

    </div>

    <!-- C 담당 JavaScript 모듈 실행 -->
    <script type="module" src="/js/main.js"></script>

</body>
</html>
